# The 'events' block is required for NGINX to function correctly
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name permissionless.money;

        root /usr/share/nginx/html;
        index index.html;

        # Serve mint page
        location = /mint {
            try_files /pages/mint.html /mint.html =404;
        }

        location = /zk { return 410; }
        location = /zk.html { return 410; }
        location = /pages/zk.html { return 410; }
        location = /zk-digest { return 410; }
        location = /loyalty { return 410; }
        location = /loyalty.html { return 410; }
        location = /contact { return 410; }
        location = /contact.html { return 410; }

        # Serve o-line SDL builder
        location = /oline {
            try_files /oline.html =404;
        }

        # i18n catalogs
        location /locales/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
        }

        # Serve lib assets (ESM bundles)
        location /lib/ {
            add_header Content-Type application/javascript;
            try_files $uri =404;
        }

        # Serve main website
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Serve public assets (favicons, manifests, etc.)
        location /public/ {
            try_files $uri =404;
        }
    }
}
