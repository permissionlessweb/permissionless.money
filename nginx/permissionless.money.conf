# permissionless.money — nginx site configuration
# Deploy: sudo cp permissionless.money.conf /etc/nginx/sites-available/
#         sudo ln -sf /etc/nginx/sites-available/permissionless.money.conf /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx

# Upstream MinIO (adjust port/host to match your deployment)
upstream minio_permissionless {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name permissionless.money www.permissionless.money;

    # Redirect HTTP → HTTPS (uncomment after cert setup)
    # return 301 https://$host$request_uri;

    # ── Root: serve index.html from MinIO bucket ──────────
    location = / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/pages/index.html;
    }

    # ── Clean URL subpages ────────────────────────────────
    # /mint → mint.html
    location = /mint {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/pages/mint.html;
    }

    # /loyalty → loyalty.html
    location = /loyalty {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/pages/loyalty.html;
    }

    # ── Static assets: /lib/ and /public/ ─────────────────
    location /lib/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/lib/;
    }

    location /public/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/public/;
    }

    # ── WASM modules ──────────────────────────────────────
    location /pkg/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/pkg/;
    }

    # ── Fallback: try MinIO bucket path, then index.html ──
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/;
    }

    # ── Caching ───────────────────────────────────────────
    # Static assets: long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_set_header Host $http_host;
        proxy_pass http://minio_permissionless/permissionless;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML: short cache (content changes)
    location ~* \.html$ {
        proxy_set_header Host $http_host;
        proxy_pass http://minio_permissionless/permissionless;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}

