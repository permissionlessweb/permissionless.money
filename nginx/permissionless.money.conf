# permissionless.money — nginx site configuration
# Deploy: sudo cp nginx/permissionless.money.conf /etc/nginx/sites-available/
#         sudo ln -sf /etc/nginx/sites-available/permissionless.money.conf /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
# MinIO bucket layout (mc mirror of dist/):
#   permissionless/pages/{index,mint}.html
#   permissionless/lib/  permissionless/locales/  permissionless/public/  permissionless/pkg/
#
# Published clean URLs: /  → index.html,  /mint → mint.html
# Unpublished: /zk /loyalty /contact (unused/soon)

# Upstream MinIO (adjust port/host to match your deployment)
upstream minio_permissionless {
    server 127.0.0.1:9000;
}

# rate zone must live in http context (this file is included from http{})
limit_req_zone $binary_remote_addr zone=pm_static:10m rate=50r/s;

# Shared proxy headers for MinIO
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name permissionless.money www.permissionless.money;
    return 301 https://permissionless.money$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name permissionless.money www.permissionless.money;

    # Cert paths — adjust if certbot uses a different live name
    ssl_certificate     /etc/letsencrypt/live/permissionless.money/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/permissionless.money/privkey.pem;
    # If certs are not on this host yet, comment the two ssl_* lines and
    # temporarily listen 80 only, or use the host's existing cert include.

    # Security headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # Common proxy to MinIO
    set $minio_bucket permissionless;

    # ── Root ──────────────────────────────────────────────
    location = / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/pages/index.html;
    }

    # ── Clean URL pages ───────────────────────────────────
    location = /mint {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/pages/mint.html;
    }

    location = /loyalty {
        return 410;
    }
    location = /loyalty.html {
        return 410;
    }
    location = /zk {
        return 410;
    }
    location = /zk.html {
        return 410;
    }
    location = /pages/zk.html {
        return 410;
    }
    location = /zk-digest {
        return 410;
    }
    location = /contact {
        return 410;
    }
    location = /contact.html {
        return 410;
    }

    # ── i18n catalogs (zk + other pages) ──────────────────
    location /locales/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://minio_permissionless/permissionless/locales/;
    }

    # ── Static assets ─────────────────────────────────────
    location /lib/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/lib/;
    }

    location /public/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/public/;
    }

    location /pkg/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/pkg/;
    }

    # Long-cache static extensions (after exact locations)
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?|json|wasm)$ {
        limit_req zone=pm_static burst=100 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless$request_uri;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback: bucket path under /permissionless/
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minio_permissionless/permissionless/;
    }
}
